<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aura — Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0c0c0c;color:#fff;height:100%;overflow:hidden;}

/* Layout */
.app{display:grid;grid-template-columns:220px 320px 1fr;grid-template-rows:2.5rem 1fr;height:100vh;}

/* Title bar */
.titlebar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.07);}
.titlebar-dots{display:flex;gap:6px;}
.dot{width:12px;height:12px;border-radius:50%;}
.titlebar-title{position:absolute;left:50%;transform:translateX(-50%);font-size:0.75rem;color:rgba(255,255,255,0.4);}
.titlebar-user{display:flex;align-items:center;gap:0.5rem;cursor:pointer;}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#0B2551);display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* Sidebar */
.sidebar{background:rgba(0,0,0,0.4);border-right:1px solid rgba(255,255,255,0.07);padding:0.75rem;display:flex;flex-direction:column;gap:0.5rem;overflow-y:auto;}
.compose-btn{display:flex;align-items:center;gap:0.5rem;width:100%;padding:0.5rem 0.75rem;border-radius:0.5rem;background:#fff;color:#000;font-size:0.75rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.compose-btn:hover{background:#f0f0f0;}

.nav-section{margin-top:0.5rem;}
.nav-label{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.3);padding:0 0.5rem;margin-bottom:0.25rem;}
.nav-item{display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0.5rem;border-radius:0.375rem;cursor:pointer;transition:background 0.1s;font-size:0.8rem;color:rgba(255,255,255,0.6);}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:rgba(255,255,255,0.1);color:#fff;}
.nav-item .count{margin-left:auto;font-size:0.65rem;background:rgba(255,255,255,0.1);padding:0.1rem 0.4rem;border-radius:9999px;color:rgba(255,255,255,0.5);}

.triage-section{margin-top:auto;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.75rem;}
.triage-item{display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0.5rem;cursor:pointer;border-radius:0.375rem;transition:background 0.1s;}
.triage-item:hover{background:rgba(255,255,255,0.05);}
.triage-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.triage-name{font-size:0.75rem;color:rgba(255,255,255,0.5);}
.triage-count{margin-left:auto;font-size:0.65rem;color:rgba(255,255,255,0.3);}

/* Thread list */
.thread-list{border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;overflow:hidden;}
.search-wrap{padding:0.625rem;border-bottom:1px solid rgba(255,255,255,0.06);}
.search-inner{display:flex;align-items:center;gap:0.5rem;background:rgba(255,255,255,0.05);border-radius:0.5rem;padding:0.375rem 0.625rem;border:1px solid rgba(255,255,255,0.07);transition:border-color 0.2s;}
.search-inner:focus-within{border-color:rgba(0,210,255,0.3);}
.search-inner input{background:transparent;border:none;color:#fff;font-size:0.75rem;font-family:inherit;width:100%;outline:none;}
.search-inner input::placeholder{color:rgba(255,255,255,0.25);}

.thread-items{flex:1;overflow-y:auto;}
.thread-item{padding:0.75rem;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.1s;position:relative;}
.thread-item:hover{background:rgba(255,255,255,0.03);}
.thread-item.active{background:rgba(255,255,255,0.06);}
.thread-item.unread .thread-from{font-weight:600;color:#fff;}
.thread-unread-dot{width:6px;height:6px;border-radius:50%;background:#3D81E3;flex-shrink:0;}
.thread-from{font-size:0.78rem;color:rgba(255,255,255,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.thread-date{font-size:0.65rem;color:rgba(255,255,255,0.35);flex-shrink:0;}
.thread-subject{font-size:0.75rem;color:rgba(255,255,255,0.75);margin-top:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread-snippet{font-size:0.7rem;color:rgba(255,255,255,0.35);margin-top:0.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread-cat{font-size:0.6rem;padding:0.1rem 0.4rem;border-radius:9999px;margin-left:4px;flex-shrink:0;}

/* Reader pane */
.reader{display:flex;flex-direction:column;overflow:hidden;}
.reader-toolbar{height:2.75rem;display:flex;align-items:center;justify-content:space-between;padding:0 0.875rem;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
.toolbar-actions{display:flex;align-items:center;gap:0.25rem;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,0.5);transition:background 0.15s,color 0.15s;}
.icon-btn:hover{background:rgba(255,255,255,0.07);color:#fff;}
.reader-body{flex:1;overflow-y:auto;padding:1.25rem;}
.reader-subject{font-size:1rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:0.875rem;line-height:1.3;}
.reader-meta{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.875rem;}
.sender-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#0B2551);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;}
.sender-name{font-size:0.8rem;font-weight:600;}
.sender-date{font-size:0.67rem;color:rgba(255,255,255,0.4);}
.label-pill{font-size:0.65rem;padding:0.125rem 0.5rem;border-radius:9999px;border:1px solid rgba(0,210,255,0.3);color:#00d2ff;margin-left:auto;flex-shrink:0;}

/* AI summary card */
.ai-card{border-radius:0.625rem;background:rgba(164,244,253,0.05);border:1px solid rgba(164,244,253,0.15);padding:0.75rem;margin-bottom:0.875rem;}
.ai-card-header{display:flex;align-items:center;gap:0.375rem;margin-bottom:0.375rem;}
.ai-card-title{font-size:0.72rem;font-weight:600;color:#A4F4FD;}
.ai-card-body{font-size:0.78rem;color:rgba(255,255,255,0.7);line-height:1.5;}
.ai-loading{display:flex;align-items:center;gap:0.375rem;font-size:0.75rem;color:rgba(255,255,255,0.4);}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:12px;height:12px;border:1.5px solid rgba(164,244,253,0.3);border-top-color:#A4F4FD;border-radius:50%;animation:spin 0.8s linear infinite;}

/* Email body */
.email-body{font-size:0.82rem;color:rgba(255,255,255,0.75);line-height:1.65;}
.email-body p{margin-bottom:0.625rem;}

/* Smart replies */
.smart-replies{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;}
.smart-reply-btn{padding:0.375rem 0.75rem;border-radius:9999px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:0.75rem;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.smart-reply-btn:hover{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.3);}

/* Attachment pill */
.attachment{display:inline-flex;align-items:center;gap:0.375rem;padding:0.375rem 0.75rem;border-radius:0.5rem;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);cursor:pointer;margin-top:0.875rem;font-size:0.72rem;color:rgba(255,255,255,0.6);text-decoration:none;}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.2);gap:0.5rem;font-size:0.875rem;}

/* Compose modal */
.compose-backdrop{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);}
.compose-backdrop.show{display:block;}
.compose-modal{position:fixed;bottom:1.5rem;right:1.5rem;width:480px;max-height:90vh;background:rgba(14,16,20,0.98);border:1px solid rgba(255,255,255,0.12);border-radius:1rem;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.7);z-index:100;display:none;flex-direction:column;}
.compose-modal.show{display:flex;}
.compose-header{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);}
.compose-header-title{font-size:0.8rem;font-weight:600;}
.compose-fields{display:flex;flex-direction:column;gap:0;}
.compose-field{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06);}
.compose-field label{font-size:0.75rem;color:rgba(255,255,255,0.4);width:3rem;flex-shrink:0;}
.compose-field input{background:transparent;border:none;color:#fff;font-size:0.8rem;font-family:inherit;width:100%;outline:none;}
.compose-body-wrap{padding:0.875rem 1rem;min-height:160px;}
.compose-body{width:100%;background:transparent;border:none;color:rgba(255,255,255,0.85);font-size:0.82rem;font-family:inherit;resize:none;outline:none;min-height:140px;line-height:1.6;}
.compose-footer{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 1rem;border-top:1px solid rgba(255,255,255,0.07);}
.ai-compose-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:0.5rem;padding:0.375rem 0.625rem;color:#fff;font-size:0.75rem;font-family:inherit;outline:none;}
.ai-compose-input::placeholder{color:rgba(255,255,255,0.25);}
.send-btn{padding:0.5rem 1.25rem;border-radius:0.5rem;background:#fff;color:#000;font-size:0.8rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.send-btn:hover{background:#f0f0f0;}

/* Toast */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,32,36,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:0.5rem;padding:0.5rem 1rem;font-size:0.8rem;opacity:0;transition:all 0.3s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
/* =========================
   RESPONSIVE FIXES
========================= */

@media (max-width: 1200px){

  .app{
    grid-template-columns:200px 280px 1fr;
  }

}

/* =========================
   TABLET
========================= */

@media (max-width: 992px){

  .app{
    grid-template-columns:80px 260px 1fr;
  }

  .sidebar{
    padding:0.5rem;
  }

  .nav-label,
  .triage-name,
  .triage-count,
  .nav-item span,
  .compose-btn span{
    display:none;
  }

  .compose-btn{
    justify-content:center;
    padding:0.7rem;
  }

  .nav-item{
    justify-content:center;
  }

  .triage-item{
    justify-content:center;
  }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px){

  html,
  body{
    overflow:hidden;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* Topbar */

  .titlebar{
    height:56px;
    flex-shrink:0;
    padding:0 0.75rem;
  }

  .titlebar-title{
    font-size:0.7rem;
  }

  /* Sidebar */

  .sidebar{
    position:fixed;
    left:-100%;
    top:56px;
    bottom:0;
    width:260px;
    z-index:300;
    background:#0c0c0c;
    transition:0.3s ease;
    padding:1rem;
  }

  .sidebar.show{
    left:0;
  }

  .nav-label,
  .triage-name,
  .triage-count,
  .nav-item span,
  .compose-btn span{
    display:block;
  }

  .nav-item{
    justify-content:flex-start;
  }

  .compose-btn{
    justify-content:flex-start;
  }

  /* Thread list */

  .thread-list{
    width:100%;
    height:40%;
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }

  /* Reader */

  .reader{
    width:100%;
    height:60%;
  }

  .reader-body{
    padding:1rem;
  }

  .reader-subject{
    font-size:0.9rem;
  }

  .email-body{
    font-size:0.78rem;
  }

  /* Compose */

  .compose-backdrop.show{display:block;}
  .compose-modal{
    width:100%;
    height:100%;
    top:0;left:0;right:0;bottom:0;
    border-radius:0;
  }

  .compose-body-wrap{
    flex:1;
  }

  .compose-body{
    min-height:250px;
  }

  /* Search */

  .search-inner input{
    font-size:16px;
  }

  /* Smart replies */

  .smart-replies{
    gap:0.35rem;
  }

  .smart-reply-btn{
    font-size:0.7rem;
  }

}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 480px){

  .thread-list{
    height:38%;
  }

  .reader{
    height:62%;
  }

  .reader-toolbar{
    padding:0 0.5rem;
  }

  .toolbar-actions{
    gap:0.15rem;
  }

  .icon-btn{
    width:24px;
    height:24px;
  }

  .reader-body{
    padding:0.8rem;
  }

  .sender-avatar{
    width:28px;
    height:28px;
    font-size:0.65rem;
  }

  .thread-item{
    padding:0.65rem;
  }

  .thread-subject{
    font-size:0.72rem;
  }

  .thread-snippet{
    font-size:0.65rem;
  }

}
</style>
</head>

   style="display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0.5rem;border-radius:0.375rem;text-decoration:none;color:rgba(255,255,255,0.4);font-size:0.8rem;transition:background 0.1s;"
   onmouseover="this.style.background='rgba(255,255,255,0.06)'"
   onmouseout="this.style.background='transparent'">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign out
</a>
<form id="logoutForm" method="POST" action="/logout" style="display:none;"></form>
    </div>
  </div>

  <!-- ── Thread list ── -->
  <div class="thread-list">
    <div class="search-wrap">
      <div class="search-inner">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search mail" oninput="onSearch(this.value)"/>
      </div>
    </div>
    <div class="thread-items" id="threadItems">
      <div class="empty">
        <div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>
        Loading inbox…
      </div>
    </div>
  </div>

  <!-- ── Reader ── -->
  <div class="reader">
    <div class="reader-toolbar">
      <div class="toolbar-actions">
        <button class="icon-btn" title="Reply" onclick="replyToSelected()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>
        </button>
        <button class="icon-btn" title="Forward">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 014-4h12"/></svg>
        </button>
        <button class="icon-btn" title="Archive" onclick="archiveSelected()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        </button>
        <button class="icon-btn" title="Star" onclick="starSelected()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <button class="icon-btn" title="Trash" onclick="trashSelected()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="reader-body" id="readerBody">
      <div class="empty" style="height:100%;">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        Select an email to read
      </div>
    </div>
  </div>
</div>

<!-- ── Compose backdrop ── -->
<div class="compose-backdrop" id="composeBackdrop" onclick="closeCompose()"></div>

<!-- ── Compose modal ── -->
<div class="compose-modal" id="composeModal">
  <div class="compose-header">
    <span class="compose-header-title">New message</span>
    <button class="icon-btn" onclick="closeCompose()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="compose-fields">
    <div class="compose-field">
      <label>To</label>
      <input type="email" id="composeTo" placeholder="recipient@email.com"/>
    </div>
    <div class="compose-field">
      <label>Subject</label>
      <input type="text" id="composeSubject" placeholder="Subject"/>
    </div>
  </div>
  <div class="compose-body-wrap">
    <textarea class="compose-body" id="composeBody" placeholder="Write your message…"></textarea>
  </div>
  <div class="compose-footer">
    <input type="text" class="ai-compose-input" id="aiInstruction" placeholder='Ask Aura: "decline politely" or "follow up on proposal"' onkeydown="if(event.key==='Enter')aiDraft()"/>
    <button class="icon-btn" title="AI Draft" onclick="aiDraft()" style="width:auto;padding:0 0.5rem;color:#A4F4FD;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"/></svg>
    </button>
    <button class="send-btn" onclick="sendEmail()">Send</button>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
let emails = [];
let filteredEmails = [];
let selectedId = null;
let currentFolder = 'INBOX';
let triageFilter = null;
let searchDebounce = null;
let replyToId = null;

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadUserInfo();
  loadEmails();
  setupKeyboard();
});

function loadUserInfo() {
  fetch('/api/user/me').then(r => r.json()).then(u => {
    document.getElementById('userName').textContent = u.name || u.email;
    document.getElementById('userInitial').textContent = (u.name || u.email)[0].toUpperCase();
  }).catch(() => {});
}

// ── Load emails ────────────────────────────────────────────────────
async function loadEmails(query) {
  showThreadLoading();
  try {
    const url = query
      ? `/api/emails/search?q=${encodeURIComponent(query)}&max=30`
      : `/api/emails?max=50`;
    const res = await fetch(url);
    emails = await res.json();
    applyFilter();
    updateTriage();
  } catch (e) {
    showError('Failed to load emails.');
  }
}

function applyFilter() {
  filteredEmails = emails.filter(e => {
    if (triageFilter) return e.triageCategory === triageFilter;
    return true;
  });
  renderThreadList();
}

function updateTriage() {
  const counts = { Priority: 0, 'Follow-up': 0, Update: 0, Archive: 0 };
  emails.forEach(e => { if (e.triageCategory) counts[e.triageCategory]++; });
  document.getElementById('countPriority').textContent = counts.Priority || '—';
  document.getElementById('countFollowup').textContent = counts['Follow-up'] || '—';
  document.getElementById('countUpdate').textContent = counts.Update || '—';
  document.getElementById('countArchive').textContent = counts.Archive || '—';
  document.getElementById('inboxCount').textContent = emails.filter(e => e.unread).length || '—';
}

// ── Render thread list ─────────────────────────────────────────────
function renderThreadList() {
  const container = document.getElementById('threadItems');
  if (!filteredEmails.length) {
    container.innerHTML = '<div class="empty">No emails here.</div>';
    return;
  }
  container.innerHTML = filteredEmails.map(e => `
    <div class="thread-item ${e.unread ? 'unread' : ''} ${e.id === selectedId ? 'active' : ''}"
         onclick="selectEmail('${e.id}')" id="ti-${e.id}">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
        ${e.unread ? '<div class="thread-unread-dot"></div>' : '<div style="width:6px"></div>'}
        <span class="thread-from">${esc(e.fromName || e.from)}</span>
        <span class="thread-date">${formatDate(e.date)}</span>
        ${e.triageCategory ? `<span class="thread-cat" style="${catStyle(e.triageCategory)}">${e.triageCategory}</span>` : ''}
      </div>
      <div class="thread-subject">${esc(e.subject)}</div>
      <div class="thread-snippet">${esc(e.snippet)}</div>
    </div>
  `).join('');
}

// ── Select email ──────────────────────────────────────────────────
async function selectEmail(id) {
  selectedId = id;
  renderThreadList();

  const email = emails.find(e => e.id === id);
  if (!email) return;

  renderReader(email, null, null, true);

  // Load AI summary + smart replies in parallel
  const [summaryRes, repliesRes] = await Promise.all([
    fetch(`/api/emails/${id}/summarize`, { method: 'POST' }),
    fetch(`/api/emails/${id}/smart-replies`, { method: 'POST' })
  ]);
  const { summary, category } = await summaryRes.json();
  const { replies } = await repliesRes.json();

  renderReader(email, summary, replies, false);

  // Update triage category in-memory
  email.triageCategory = category;
  updateTriage();
}

function renderReader(email, summary, replies, loading) {
  const body = email.body || email.snippet || '';
  document.getElementById('readerBody').innerHTML = `
    <h2 class="reader-subject">${esc(email.subject)}</h2>
    <div class="reader-meta">
      <div class="sender-avatar">${(email.fromName || email.from)[0].toUpperCase()}</div>
      <div>
        <div class="sender-name">${esc(email.fromName || email.from)}</div>
        <div class="sender-date">${email.date}</div>
      </div>
      ${email.labels && email.labels.includes('CATEGORY_WORK') ? '<span class="label-pill">Work</span>' : ''}
    </div>

    <div class="ai-card">
      <div class="ai-card-header">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#A4F4FD" stroke-width="2"><path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"/></svg>
        <span class="ai-card-title">Summary by Aura</span>
      </div>
      ${loading
        ? `<div class="ai-loading"><div class="spinner"></div> Summarizing…</div>`
        : `<div class="ai-card-body">${esc(summary || 'No summary available.')}</div>`
      }
    </div>

    <div class="email-body">${formatBody(body)}</div>

    ${email.hasUnsubscribe ? `<div style="margin-top:1rem;"><a href="${email.unsubscribeUrl}" target="_blank" style="font-size:0.75rem;color:#00d2ff;padding:0.375rem 0.75rem;border:1px solid rgba(0,210,255,0.3);border-radius:9999px;text-decoration:none;display:inline-flex;align-items:center;gap:0.375rem;">Unsubscribe</a></div>` : ''}

    ${!loading && replies && replies.length ? `
      <div class="smart-replies">
        ${replies.map(r => `<button class="smart-reply-btn" onclick="useSmartReply('${esc(r)}')">${esc(r)}</button>`).join('')}
      </div>
    ` : ''}
  `;
}

// ── Actions ────────────────────────────────────────────────────────
async function archiveSelected() {
  if (!selectedId) return;
  await fetch(`/api/emails/${selectedId}/archive`, { method: 'POST' });
  emails = emails.filter(e => e.id !== selectedId);
  selectedId = null;
  applyFilter();
  document.getElementById('readerBody').innerHTML = '<div class="empty" style="height:100%">Archived ✓</div>';
  toast('Archived');
}

async function starSelected() {
  if (!selectedId) return;
  await fetch(`/api/emails/${selectedId}/star`, { method: 'POST' });
  toast('Starred');
}

async function trashSelected() {
  if (!selectedId) return;
  await fetch(`/api/emails/${selectedId}/trash`, { method: 'POST' });
  emails = emails.filter(e => e.id !== selectedId);
  selectedId = null;
  applyFilter();
  toast('Moved to trash');
}

function replyToSelected() {
  const email = emails.find(e => e.id === selectedId);
  if (!email) return;
  replyToId = selectedId;
  openCompose(email.from, 'Re: ' + email.subject);
}

function useSmartReply(text) {
  const email = emails.find(e => e.id === selectedId);
  openCompose(email?.from || '', 'Re: ' + (email?.subject || ''), text);
}

// ── Search ────────────────────────────────────────────────────────
function onSearch(val) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    triageFilter = null;
    loadEmails(val.trim() || null);
  }, 400);
}

// ── Folder + triage filter ─────────────────────────────────────────
function setFolder(folder, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  currentFolder = folder;
  triageFilter = null;
  loadEmails();
}

function filterTriage(cat) {
  triageFilter = triageFilter === cat ? null : cat;
  applyFilter();
}

// ── Compose ────────────────────────────────────────────────────────
function openCompose(to = '', subject = '', body = '') {
  document.getElementById('composeTo').value = to;
  document.getElementById('composeSubject').value = subject;
  document.getElementById('composeBody').value = body;
  document.getElementById('composeModal').classList.add('show');
  document.getElementById('composeBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('composeTo').focus(), 50);
}

function closeCompose() {
  document.getElementById('composeModal').classList.remove('show');
  document.getElementById('composeBackdrop').classList.remove('show');
  document.body.style.overflow = '';
  replyToId = null;
}

async function sendEmail() {
  const to = document.getElementById('composeTo').value.trim();
  const subject = document.getElementById('composeSubject').value.trim();
  const body = document.getElementById('composeBody').value.trim();
  if (!to || !body) return toast('Fill in To and body.');

  const res = await fetch('/api/emails/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to, subject, body, inReplyToId: replyToId })
  });
  const { success } = await res.json();
  if (success) { closeCompose(); toast('Sent ✓'); }
  else toast('Failed to send.');
}

async function aiDraft() {
  const instruction = document.getElementById('aiInstruction').value.trim();
  if (!instruction) return;
  const email = emails.find(e => e.id === selectedId);
  const context = email ? `Replying to: "${email.subject}" from ${email.fromName}` : '';
  document.getElementById('composeBody').value = 'Drafting…';
  const res = await fetch('/api/emails/compose-ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ instruction, context })
  });
  const { draft } = await res.json();
  document.getElementById('composeBody').value = draft;
  document.getElementById('aiInstruction').value = '';
}

// ── Keyboard shortcuts ─────────────────────────────────────────────
function setupKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'e') archiveSelected();
    if (e.key === 'r') replyToSelected();
    if (e.key === 's') starSelected();
    if (e.key === '#') trashSelected();
    if (e.key === 'c') openCompose();
    if (e.key === 'j' || e.key === 'ArrowDown') moveSelection(1);
    if (e.key === 'k' || e.key === 'ArrowUp') moveSelection(-1);
    if (e.key === 'Escape') closeCompose();
  });
}

function moveSelection(dir) {
  const idx = filteredEmails.findIndex(e => e.id === selectedId);
  const next = filteredEmails[idx + dir];
  if (next) selectEmail(next.id);
}

// ── Helpers ────────────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (d > new Date(now - 7 * 86400000)) return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  } catch { return ''; }
}

function formatBody(body) {
  if (!body) return '';
  const isHtml = /<[a-z][\s\S]*>/i.test(body);
  if (isHtml) {
    // Render HTML emails in a sandboxed iframe
    const escaped = body.replace(/"/g, '&quot;');
    return `<iframe 
      srcdoc="${escaped}"
      style="width:100%;min-height:500px;border:none;background:#fff;border-radius:0.5rem;"
      sandbox="allow-same-origin"
      onload="this.style.height=this.contentDocument.body.scrollHeight+40+'px'"
    ></iframe>`;
  }
  // Plain text — preserve line breaks
  return body.split('\n').map(l => l.trim() ? `<p>${esc(l)}</p>` : '<br>').join('');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function catStyle(cat) {
  const map = {
    'Priority': 'background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)',
    'Follow-up': 'background:rgba(0,210,255,0.1);color:#00d2ff',
    'Update': 'background:rgba(164,244,253,0.1);color:#A4F4FD',
    'Archive': 'background:rgba(80,80,80,0.2);color:rgba(255,255,255,0.3)'
  };
  return map[cat] || '';
}

function showThreadLoading() {
  document.getElementById('threadItems').innerHTML =
    '<div class="empty"><div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>Loading…</div>';
}

function showError(msg) {
  document.getElementById('threadItems').innerHTML = `<div class="empty">${msg}</div>`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
<script>
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('show');
}
</script>
</body>
</html>
