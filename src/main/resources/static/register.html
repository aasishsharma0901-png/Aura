<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Aura — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#0c0c0c;color:#fff;min-height:100%;overflow-x:hidden;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg)}}

.page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1rem;position:relative;}

/* Ambient glow */
.glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-60%);pointer-events:none;}
.glow2{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(164,244,253,0.04) 0%,transparent 70%);bottom:0;right:0;pointer-events:none;}

/* Card */
.card{
  width:100%;max-width:420px;padding:2.5rem;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:1.5rem;
  animation:fadeUp 0.7s cubic-bezier(.22,1,.36,1) forwards;
  position:relative;z-index:10;
  box-shadow:0 0 80px rgba(0,0,0,0.5);
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(180deg,rgba(255,255,255,0.2) 0%,rgba(255,255,255,0.05) 50%,rgba(255,255,255,0.15) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}

/* Logo */
.logo{display:flex;align-items:center;gap:0.625rem;margin-bottom:2rem;}
.logo-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.03em;}

/* Heading */
.heading{font-size:1.5rem;font-weight:600;letter-spacing:-0.04em;line-height:1.1;margin-bottom:0.5rem;}
.subheading{font-size:0.875rem;color:rgba(255,255,255,0.5);line-height:1.5;margin-bottom:2rem;}

/* Fields */
.field{display:flex;flex-direction:column;gap:0.375rem;margin-bottom:1rem;}
.field label{font-size:0.8rem;font-weight:500;color:rgba(255,255,255,0.7);}
.field input{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  border-radius:0.5rem;padding:0.625rem 0.875rem;
  color:#fff;font-size:0.875rem;font-family:inherit;
  transition:border-color 0.2s,background 0.2s;
  outline:none;
}
.field input:focus{border-color:rgba(0,210,255,0.5);background:rgba(255,255,255,0.08);}
.field input::placeholder{color:rgba(255,255,255,0.2);}
.field input.error{border-color:rgba(239,68,68,0.5);}

/* Row layout for two fields */
/* Row layout for two fields */
.field-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:0.75rem;
  width:100%;
}

.field-row .field{
  min-width:0;
}

.field-row input{
  width:100%;
}

/* Password strength */
.strength-bar{height:3px;border-radius:9999px;background:rgba(255,255,255,0.08);margin-top:0.375rem;overflow:hidden;}
.strength-fill{height:100%;border-radius:9999px;transition:width 0.3s,background 0.3s;width:0%;}
.strength-label{font-size:0.7rem;color:rgba(255,255,255,0.35);margin-top:0.25rem;}

/* Submit button */
.submit-btn{
  width:100%;padding:0.75rem;border-radius:0.625rem;
  background:#fff;border:none;color:#000;
  font-size:0.875rem;font-weight:600;font-family:inherit;
  cursor:pointer;margin-bottom:0.5rem;
  transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:0.5rem;
}
.submit-btn:hover{background:#f0f0f0;transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,255,255,0.1);}
.submit-btn:active{transform:scale(0.98);}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}

/* Divider */
.divider{display:flex;align-items:center;gap:0.75rem;margin:1rem 0;}
.divider hr{flex:1;border:none;border-top:1px solid rgba(255,255,255,0.1);}
.divider span{font-size:0.75rem;color:rgba(255,255,255,0.3);}

/* Google button */
.google-btn{
  display:flex;align-items:center;justify-content:center;gap:0.625rem;
  width:100%;padding:0.75rem;border-radius:0.625rem;
  background:rgba(255,255,255,0.06);color:#fff;
  font-size:0.875rem;font-weight:500;font-family:inherit;
  border:1px solid rgba(255,255,255,0.12);cursor:pointer;
  transition:all 0.2s;text-decoration:none;
}
.google-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}

/* Banner */
.banner{
  display:none;align-items:center;gap:0.5rem;padding:0.625rem 0.875rem;
  border-radius:0.5rem;margin-bottom:1rem;font-size:0.8rem;
}
.banner.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
.banner.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac;}
.banner.show{display:flex;}

/* Footer */
.footer{margin-top:1.25rem;text-align:center;font-size:0.75rem;color:rgba(255,255,255,0.3);}
.footer a{color:rgba(0,210,255,0.8);text-decoration:none;}
.footer a:hover{color:#00d2ff;}

/* Terms checkbox */
.checkbox-row{display:flex;align-items:flex-start;gap:0.625rem;margin-bottom:1.25rem;}
.checkbox-row input[type=checkbox]{width:15px;height:15px;accent-color:#00d2ff;flex-shrink:0;margin-top:2px;cursor:pointer;}
.checkbox-row label{font-size:0.75rem;color:rgba(255,255,255,0.4);line-height:1.5;cursor:pointer;}
.checkbox-row a{color:rgba(0,210,255,0.8);text-decoration:none;}
</style>
</head>
<body>

<div class="glow"></div>
<div class="glow2"></div>

<div class="page">
  <div style="width:100%;max-width:420px;padding:1rem;position:relative;z-index:10;">
    <div class="card">

      <!-- Logo -->
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 256 256" fill="none">
          <path d="M 0 128 C 70.692 128 128 185.308 128 256 L 64 256 C 64 220.654 35.346 192 0 192 Z M 256 192 C 220.654 192 192 220.654 192 256 L 128 256 C 128 185.308 185.308 128 256 128 Z M 128 0 C 128 70.692 70.692 128 0 128 L 0 64 C 35.346 64 64 35.346 64 0 Z M 192 0 C 192 35.346 220.654 64 256 64 L 256 128 C 185.308 128 128 70.692 128 0 Z" fill="white"/>
        </svg>
        <span class="logo-text">Aura</span>
      </div>

      <h1 class="heading">Create your account</h1>
      <p class="subheading">Join Aura and experience email the way it should feel.</p>

      <!-- Banners -->
      <div class="banner error" id="errorBanner">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMsg">Something went wrong. Please try again.</span>
      </div>
 <div class="banner success" id="successBanner">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="successMsg">Account created! Redirecting to sign in…</span>
</div>

      <!-- Form -->
      <div class="field-row">
        <div class="field">
          <label>First name</label>
          <input type="text" id="firstName" placeholder="Aasish" autocomplete="given-name"/>
        </div>
        <div class="field">
          <label>Last name</label>
          <input type="text" id="lastName" placeholder="Sharma" autocomplete="family-name"/>
        </div>
      </div>

      <div class="field">
        <label>Email address</label>
        <input type="email" id="regEmail" placeholder="you@company.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="regConfirm" placeholder="Repeat password" autocomplete="new-password"/>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="agreeTerms"/>
        <label for="agreeTerms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="register()">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Create account</span>
      </button>

      <div class="divider"><hr/><span>or sign up with</span><hr/></div>

      <a href="/oauth2/authorization/google" class="google-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </a>

      <div class="footer">
        Already have an account? <a href="/login.html">Sign in</a>
        &nbsp;·&nbsp;
        <a href="/">← Back to home</a>
      </div>

    </div>
  </div>
</div>

<script>
// Password strength checker
function checkStrength(val) {
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }

  let score = 0;
  if (val.length >= 8) score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const levels = [
    { w: '20%', bg: '#ef4444', text: 'Very weak' },
    { w: '40%', bg: '#f97316', text: 'Weak' },
    { w: '60%', bg: '#eab308', text: 'Fair' },
    { w: '80%', bg: '#22c55e', text: 'Strong' },
    { w: '100%', bg: '#00d2ff', text: 'Very strong' },
  ];
  const lvl = levels[Math.min(score - 1, 4)] || levels[0];
  fill.style.width = lvl.w;
  fill.style.background = lvl.bg;
  label.textContent = lvl.text;
  label.style.color = lvl.bg;
}

async function register() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName  = document.getElementById('lastName').value.trim();
  const email     = document.getElementById('regEmail').value.trim();
  const password  = document.getElementById('regPassword').value;
  const confirm   = document.getElementById('regConfirm').value;
  const agreed    = document.getElementById('agreeTerms').checked;

  // Validation
  if (!firstName || !email || !password) {
    showError('Please fill in all required fields.');
    return;
  }
  if (password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showError('Passwords do not match.');
    return;
  }
  if (!agreed) {
    showError('Please agree to the Terms of Service.');
    return;
  }

  // Loading state
  setLoading(true);
  hideError();

  try {
    console.log('Sending registration request for:', email);
    
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: `${firstName} ${lastName}`.trim(),
        email: email,
        password: password
      })
    });
    
    console.log('Response status:', res.status);
    const data = await res.json();
    console.log('Response data:', data);

   if (data.success === true) {
  const successBanner = document.getElementById('successBanner');
  const successMsg = document.getElementById('successMsg');
  successMsg.textContent = data.message || 'Account created! Redirecting...';
  successBanner.classList.add('show');
  
  setTimeout(() => {
    window.location.href = '/login.html';
  }, 2000);
}else {
      showError(data.message || 'Registration failed. Please try again.');
      setLoading(false);
    }
  } catch (err) {
    console.error('Registration error:', err);
    showError('Network error. Please check your connection and try again.');
    setLoading(false);
  }
}

function setLoading(on) {
  const btn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  btnText.textContent = on ? 'Creating account…' : 'Create account';
}

function showError(msg) {
  const errorBanner = document.getElementById('errorBanner');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = msg;
  errorBanner.classList.add('show');
  
  // Auto hide after 5 seconds
  setTimeout(() => {
    errorBanner.classList.remove('show');
  }, 5000);
}

function hideError() {
  document.getElementById('errorBanner').classList.remove('show');
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    register();
  }
});

// Also add click handler to the button
document.getElementById('submitBtn').onclick = register;
</script>
</body>
</html>
